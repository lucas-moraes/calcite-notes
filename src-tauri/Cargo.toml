[package]
name = "calcite"
version = "1.4.1"
description = "A powerful markdown knowledge base with bi-directional linking and graph view"
authors = ["Calcite"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "calcite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
walkdir = "2.5"
regex = "1"
chrono = "0.4"
dirs = "6"
